version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aether-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aether_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: always
    # Auto-enable keyspace notifications for expired keys (Ex) on startup
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"

  server:
    build: ./server
    container_name: aether-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/aether_chat?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=docker_secure_jwt_access_secret_9988!
      - JWT_REFRESH_SECRET=docker_secure_jwt_refresh_secret_9988!
      - CLIENT_URL=http://localhost
      - GEMINI_API_KEY= # Set your Gemini API key here
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    container_name: aether-client
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  pgdata:
  uploads:
